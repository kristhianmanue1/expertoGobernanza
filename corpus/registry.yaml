# Registro de fuentes — componente A del dictamen (2026-08-06)
#
# Procedencia de cada instrumento oficial cargado al corpus. Los originales (PDF, etc.)
# NO se versionan (ver .gitignore: corpus/originals/); se conservan vía hash + URL.
#
# Niveles de fuente: 1=primaria (publicidad del acto, tip. DOF federal),
# 2=consolidada/institucional (Cámara, Orden Jurídico — informativo),
# 3=jurisprudencial (SCJN/SJF), 4=derivados del corpus.
# Metodología completa: docs/fuentes-legal-mx.md
# Auth canales: docs/autorizacion-fuentes-r1.md
# §7: procedencia_primaria_verificada=true exige traza nivel 1 usable.
# Extensión (fuentes-legal-mx.md §1.1-bis y §4, F1–F5):
#   traza_disposicion_principal: {disposicion_id, fecha, tipo_acto, cubre_disposicion}
#   ultima_reforma_cuerpo: {fecha, cubre_disposicion: false}  ← NO es traza del artículo
#   trazas_publicacion[]: alcance, cubre_disposiciones[] | no_cubre_slice, url|ids
#   revision_procedencia: {revisado_por, fecha, auto_revision_declarada}
# procedencia_primaria_verificada resume el instrumento, NO autoriza vigencia actual.
# vigencia_verificada=false es el campo legado conservador durante esta migración.
# Resolver cada disposición con registry_rules.resolve_disposicion_vigencia;
# en slices múltiples, traza_disposiciones[].f5 es obligatoria y autoritativa.
# NUNCA usar ultima_reforma_cuerpo.fecha como "origen" de una disposición del slice.

