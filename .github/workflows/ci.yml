name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + gate de tamaño
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilación (sintaxis)
        run: python -m py_compile corpus/*.py scripts/*.py review_routing/*.py
      - name: Golden set (unittest)
        run: python -m unittest discover -s tests
      - name: Gate de tamaño §3 (check_sizes)
        run: python scripts/check_sizes.py
